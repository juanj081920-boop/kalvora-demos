/* =====================================================================
   TEMA "SMASH": comida rápida con actitud. Letra gruesa condensada,
   mostaza y salsa de tomate sobre negro, botones gorditos.
   ===================================================================== */
:root{
  color-scheme:dark;
  --f-display:'Anton','Impact','Haettenschweiler','Arial Narrow Bold',sans-serif;
  --f-body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --h-case:uppercase; --h-weight:400; --h-track:.01em;

  --bg:#131110; --panel:#1D1A18; --panel-2:#282421; --line:rgba(255,240,220,.12);
  --txt:#FFF6EA; --muted:#CDBFAE; --placeholder:#958879;
  --acc:#FFC233; --acc-ink:#1A1200;
  --acc-2:#E8352B; --acc-2-ink:#FFFFFF;
  --ok:#7CC144; --warn:#FFB020; --error:#FFB4AB;

  --hero-bg:radial-gradient(circle at 80% 35%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 50%),linear-gradient(160deg,#1C1816 0%,#131110 70%);
  --hero-ink:#FFF6EA; --hero-muted:#E9DCCB; --hero-dots:rgba(255,194,51,.08);
  --hero-shadow:none; --estado-bg:rgba(19,17,16,.6);
  --hero-btn-bg:var(--acc); --hero-btn-ink:var(--acc-ink);
  --hero-btn2-bg:rgba(255,255,255,.06); --hero-btn2-ink:#FFF6EA; --hero-btn2-line:rgba(255,255,255,.25);

  --aviso-bg:#0C0B0A; --footer-bg:#0C0B0A; --tabs-bg:rgba(19,17,16,.82);
  --r-card:18px; --r-btn:14px; --r-input:12px; --shadow-card:0 10px 0 -4px rgba(0,0,0,.45);
  --theme-color:#131110;
}
.hero h1{color:var(--acc);font-size:clamp(3.4rem,13vw,7rem);line-height:.88}
.lema{font-weight:600}
.btn{font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.tab{font-weight:600}
.cat h2{font-size:2.3rem}
.titulo-sec h2{font-size:2rem}
.precio{font-weight:800}
.reco h2,.reco__grid h3{font-size:2.2rem}
.reco__card--grande h3{font-size:2.4rem}
.item h3{font-weight:800}
.img__tag{background:var(--acc-2);border-color:transparent;font-weight:600}
.barra__n{background:var(--acc-2)}

*{box-sizing:border-box}body{margin:0;background:#e9e6e1;font-family:var(--f-body,system-ui);display:grid;place-items:center;min-height:100vh;padding:16px}
.hoja{width:min(100%,148mm);aspect-ratio:148/210;background:radial-gradient(circle at 80% 35%,color-mix(in srgb,var(--acc) 30%,transparent),transparent 50%),linear-gradient(160deg,#1C1816 0%,#131110 70%);color:#fff;border-radius:18px;padding:9% 9% 7%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4%;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;overflow:hidden}
.hoja::before{content:'';position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.12) 1.4px,transparent 1.6px) 0 0/20px 20px;pointer-events:none}
h1{margin:0;font:700 clamp(1.6rem,6vw,2.6rem)/1 var(--f-display,system-ui);text-transform:var(--h-case,none);letter-spacing:var(--h-track,0);position:relative}
.lema{margin:0;opacity:.85;position:relative}
.qr{position:relative;background:#fff;padding:6%;border-radius:22px;width:68%;box-shadow:0 0 0 6px #FFC233}
.qr svg{width:100%;height:auto;display:block}
.paso{position:relative;margin:0;font-weight:700;font-size:1.15rem}
.paso span{display:inline-block;background:#FFC233;color:#111;border-radius:999px;padding:4px 14px}
.url{position:relative;margin:auto 0 0;font:400 .8rem/1.4 var(--f-mono,monospace);opacity:.8;word-break:break-all}
.k{position:relative;font:400 .62rem/1 var(--f-mono,monospace);letter-spacing:.12em;text-transform:uppercase;opacity:.6}
