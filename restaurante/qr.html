/* =====================================================================
   TEMA "LUMIÈRE": restaurante con clase. Negro cálido, champaña y
   plata, letra con serifa fina, botones rectos, mucho aire.
   Pensado para la carta tipográfica (estilo: 'carta').
   ===================================================================== */
:root{
  color-scheme:dark;
  --f-display:'Cormorant Garamond','Cormorant',Garamond,'Times New Roman',serif;
  --f-body:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --f-mono:'Jost','Futura','Century Gothic',system-ui,sans-serif;
  --h-case:none; --h-weight:500; --h-track:-.005em;

  --bg:#100E0C; --panel:#171410; --panel-2:#211D18; --line:rgba(226,212,184,.13);
  --txt:#EFE7D8; --muted:#B4A892; --placeholder:#7C725F;
  --acc:#CDB385; --acc-ink:#15110B;
  --acc-2:#9EA7B0; --acc-2-ink:#101214;
  --ok:#A9C49A; --warn:#D9B36A; --error:#F2B8A8;

  --hero-bg:radial-gradient(ellipse at 72% 45%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 58%),linear-gradient(180deg,#15120F 0%,#0E0C0A 100%);
  --hero-ink:#F3EBDD; --hero-muted:#C9BDA7; --hero-dots:rgba(205,179,133,.05);
  --hero-shadow:none; --estado-bg:rgba(16,14,12,.6);
  --hero-btn-bg:var(--acc); --hero-btn-ink:var(--acc-ink);
  --hero-btn2-bg:transparent; --hero-btn2-ink:#F3EBDD; --hero-btn2-line:rgba(226,212,184,.35);

  --aviso-bg:#0B0A08; --footer-bg:#0B0A08; --tabs-bg:rgba(16,14,12,.82);
  --r-card:6px; --r-btn:3px; --r-input:3px; --shadow-card:none;
  --theme-color:#100E0C;
}
/* Detalles propios del tema */
.hero h1{font-weight:500;font-size:clamp(2.8rem,8vw,5rem);line-height:.95;letter-spacing:-.01em}
.hero h1::after{content:'';display:block;width:64px;height:1px;margin-top:20px;background:var(--acc)}
.lema{font-family:var(--f-display);font-style:italic;font-size:1.35rem;color:var(--hero-muted)}
.btn{text-transform:uppercase;letter-spacing:.16em;font-size:.74rem;font-weight:500;padding:0 22px}
.btn::after{display:none}
.btn:not(.btn--ghost):not(.btn--oscuro):not(.btn--claro){box-shadow:none}
.btn--full{font-size:.8rem}
.tab{text-transform:uppercase;letter-spacing:.14em;font-size:.74rem}
.tab[aria-current="true"]{background:none;color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.cat h2{font-size:2.1rem;font-style:italic}
.cat h2::after{height:1px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 60%,transparent),transparent)}
.cat h2 span{display:none!important}
.precio{font-family:var(--f-display);font-size:1.3rem;font-weight:600;color:var(--acc)}
.titulo-sec h2{font-size:2rem;font-style:italic}
.img{background:radial-gradient(circle at 50% 42%,#2A241D 0,#15120F 75%)!important}
.img::after{opacity:.25}
.img svg{color:var(--acc);filter:none!important}
.img svg.linea{width:76%;height:80%}
.hero__arte svg{filter:none;color:var(--acc)}
.reco__card{background:var(--panel);border-color:color-mix(in srgb,var(--acc) 30%,var(--line));box-shadow:none}
.reco__card::before{display:none}
.reco__eyebrow{background:none;color:var(--acc);padding:0;letter-spacing:.2em}
.reco__img svg{animation:none}
.img__tag{font-family:var(--f-body);letter-spacing:.14em}
.item--carta h3{font-size:1.45rem;font-weight:600}
.item--carta .precio{font-size:1.25rem}
.dato i{border-radius:3px}
.barra__total{border-radius:3px}
.reserva-band .wrap{padding:28px 28px;border-radius:6px}
.reserva-band h2{font-size:2.1rem;font-style:italic}

*{box-sizing:border-box}body{margin:0;background:#e9e6e1;font-family:var(--f-body,system-ui);display:grid;place-items:center;min-height:100vh;padding:16px}
.hoja{width:min(100%,148mm);aspect-ratio:148/210;background:radial-gradient(ellipse at 72% 45%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 58%),linear-gradient(180deg,#15120F 0%,#0E0C0A 100%);color:#fff;border-radius:18px;padding:9% 9% 7%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4%;box-shadow:0 20px 50px rgba(0,0,0,.25);position:relative;overflow:hidden}
.hoja::before{content:'';position:absolute;inset:0;background:radial-gradient(rgba(255,255,255,.12) 1.4px,transparent 1.6px) 0 0/20px 20px;pointer-events:none}
h1{margin:0;font:700 clamp(1.6rem,6vw,2.6rem)/1 var(--f-display,system-ui);text-transform:var(--h-case,none);letter-spacing:var(--h-track,0);position:relative}
.lema{margin:0;opacity:.85;position:relative}
.qr{position:relative;background:#fff;padding:6%;border-radius:22px;width:68%;box-shadow:0 0 0 6px #CDB385}
.qr svg{width:100%;height:auto;display:block}
.paso{position:relative;margin:0;font-weight:700;font-size:1.15rem}
.paso span{display:inline-block;background:#CDB385;color:#111;border-radius:999px;padding:4px 14px}
.url{position:relative;margin:auto 0 0;font:400 .8rem/1.4 var(--f-mono,monospace);opacity:.8;word-break:break-all}
